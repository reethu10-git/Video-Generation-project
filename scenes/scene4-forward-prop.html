<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 4: Forward Propagation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #070b16;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      padding: 60px 100px;
      display: flex;
      flex-direction: column;
    }
    .header {
      opacity: 0;
      transform: translateY(-20px);
    }
    .tag {
      font-size: 18px;
      color: #10b981;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .scene-title {
      font-size: 52px;
      font-weight: 800;
    }
    .flow-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-around;
      position: relative;
    }
    .layer-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      z-index: 2;
    }
    .layer-label {
      font-size: 22px;
      font-weight: 700;
      color: #94a3b8;
    }
    .node-stack {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .node {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #0f172a;
      border: 3px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
      transition: all 0.3s;
    }
    .node.hidden-1 { border-color: #818cf8; box-shadow: 0 0 15px rgba(129, 140, 248, 0.2); }
    .node.hidden-2 { border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); }
    .node.output   { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
    
    .connections-svg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .synapse {
      stroke: #1e293b;
      stroke-width: 2.5;
    }
    .active-synapse {
      stroke: #38bdf8;
      stroke-width: 3.5;
      opacity: 0;
    }
    .banner-flow {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      padding: 12px 32px;
      border-radius: 9999px;
      font-size: 24px;
      font-weight: 600;
      opacity: 0;
    }
  </style>
  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    if (typeof gsap === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"><\\/script>');
    }
  </script>
</head>
<body>
  <div id="stage">
    <div class="header" id="header">
      <div class="tag">Inference & Prediction</div>
      <h2 class="scene-title">Forward Propagation: Data in Motion</h2>
    </div>

    <div class="flow-container">
      <!-- Input Layer -->
      <div class="layer-card" id="layer-in">
        <span class="layer-label">Input Layer</span>
        <div class="node-stack">
          <div class="node">X₁</div>
          <div class="node">X₂</div>
          <div class="node">X₃</div>
        </div>
      </div>

      <!-- Hidden Layer 1 -->
      <div class="layer-card" id="layer-h1">
        <span class="layer-label">Hidden Layer 1</span>
        <div class="node-stack">
          <div class="node hidden-1">H₁</div>
          <div class="node hidden-1">H₂</div>
          <div class="node hidden-1">H₃</div>
          <div class="node hidden-1">H₄</div>
        </div>
      </div>

      <!-- Hidden Layer 2 -->
      <div class="layer-card" id="layer-h2">
        <span class="layer-label">Hidden Layer 2</span>
        <div class="node-stack">
          <div class="node hidden-2">H₅</div>
          <div class="node hidden-2">H₆</div>
          <div class="node hidden-2">H₇</div>
        </div>
      </div>

      <!-- Output Layer -->
      <div class="layer-card" id="layer-out">
        <span class="layer-label">Output Layer</span>
        <div class="node-stack">
          <div class="node output">Ŷ</div>
        </div>
      </div>

      <div class="banner-flow" id="banner">
        Signal flows left to right: Inputs ➔ Feature Extraction ➔ Final Decision
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    tl.to("#header", { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.2)
      .from("#layer-in", { opacity: 0, x: -40, duration: 0.8, ease: "power2.out" }, 0.6)
      .from("#layer-h1", { opacity: 0, y: 30, duration: 0.8, ease: "power2.out" }, 1.0)
      .from("#layer-h2", { opacity: 0, y: 30, duration: 0.8, ease: "power2.out" }, 1.4)
      .from("#layer-out", { opacity: 0, x: 40, duration: 0.8, ease: "power2.out" }, 1.8)
      .to("#banner", { opacity: 1, duration: 0.8, ease: "power2.out" }, 2.2)
      // Pulse sequence across layers
      .to("#layer-in .node", { borderColor: "#67e8f9", boxShadow: "0 0 30px #06b6d4", stagger: 0.1, duration: 0.4 }, 2.6)
      .to("#layer-h1 .node", { borderColor: "#c084fc", boxShadow: "0 0 30px #a855f7", stagger: 0.1, duration: 0.4 }, 3.1)
      .to("#layer-h2 .node", { borderColor: "#e879f9", boxShadow: "0 0 30px #d946ef", stagger: 0.1, duration: 0.4 }, 3.6)
      .to("#layer-out .node", { borderColor: "#6ee7b7", boxShadow: "0 0 40px #10b981", scale: 1.2, duration: 0.6, ease: "back.out(2)" }, 4.1)
      .to("#stage", { opacity: 0, duration: 0.6, ease: "power2.in" }, 5.4);

    window.seekTimeline = function(seconds) { tl.seek(seconds); };
    window.getTimelineDuration = function() { return 6.0; };
  </script>
</body>
</html>
