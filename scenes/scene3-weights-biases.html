<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 3: Weights and Biases</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #090e1d;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      padding: 60px 100px;
      display: flex;
      flex-direction: column;
    }
    .header {
      opacity: 0;
      transform: translateY(-20px);
    }
    .tag {
      font-size: 18px;
      color: #f59e0b;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .scene-title {
      font-size: 52px;
      font-weight: 800;
    }
    .container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    .card {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(30px);
    }
    .card-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .card-title.weights { color: #38bdf8; }
    .card-title.biases { color: #f59e0b; }
    .card-desc {
      font-size: 22px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .formula-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      font-size: 36px;
      font-family: 'Fira Code', 'Courier New', monospace;
      text-align: center;
      letter-spacing: 2px;
    }
    .f-w { color: #38bdf8; font-weight: bold; }
    .f-x { color: #ffffff; }
    .f-b { color: #f59e0b; font-weight: bold; }
    .slider-track {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      position: relative;
      margin-top: 20px;
    }
    .slider-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 6px;
      width: 40%;
    }
  </style>
  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
  <script>
    if (typeof gsap === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"><\\/script>');
    }
  </script>
</head>
<body>
  <div id="stage">
    <div class="header" id="header">
      <div class="tag">Parameters & Learning</div>
      <h2 class="scene-title">Weights & Biases: The Tunable Knobs</h2>
    </div>

    <div class="container">
      <!-- Weights Card -->
      <div class="card" id="card-weights">
        <div class="card-title weights">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
          Synaptic Weights (W)
        </div>
        <p class="card-desc">Control the strength and influence of each incoming input signal.</p>
        <div class="formula-box">
          <span class="f-w">W₁</span> · <span class="f-x">X₁</span> + <span class="f-w">W₂</span> · <span class="f-x">X₂</span>
        </div>
        <div class="slider-track">
          <div class="slider-fill" id="weight-slider"></div>
        </div>
      </div>

      <!-- Biases Card -->
      <div class="card" id="card-biases">
        <div class="card-title biases">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Activation Bias (b)
        </div>
        <p class="card-desc">Shifts the activation threshold, deciding how easily the neuron fires.</p>
        <div class="formula-box">
          Total = ∑(W · X) + <span class="f-b">b</span>
        </div>
        <div class="slider-track">
          <div class="slider-fill" id="bias-slider" style="background: linear-gradient(90deg, #f59e0b, #ef4444); width: 65%;"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    tl.to("#header", { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.2)
      .to("#card-weights", { opacity: 1, y: 0, duration: 1.0, ease: "back.out(1.4)" }, 0.8)
      .to("#card-biases", { opacity: 1, y: 0, duration: 1.0, ease: "back.out(1.4)" }, 1.4)
      .to("#weight-slider", { width: "85%", duration: 1.5, ease: "sine.inOut" }, 2.4)
      .to("#bias-slider", { width: "30%", duration: 1.5, ease: "sine.inOut" }, 3.0)
      .to("#stage", { opacity: 0, duration: 0.6, ease: "power2.in" }, 5.4);

    window.seekTimeline = function(seconds) { tl.seek(seconds); };
    window.getTimelineDuration = function() { return 6.0; };
  </script>
</body>
</html>
