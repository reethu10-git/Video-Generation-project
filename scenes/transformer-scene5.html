<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 5: Self-Attention</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #08152b 0%, #040813 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }
    #stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      padding: 60px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      opacity: 0;
      transform: translateY(-20px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .title {
      font-size: 56px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 24px;
      color: #94a3b8;
    }
    .attention-stage {
      flex: 1;
      width: 1600px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    svg.attention-svg {
      width: 1500px;
      height: 480px;
    }
    .word-node {
      font-size: 24px;
      font-weight: 700;
      fill: #cbd5e1;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .word-box {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 2px;
    }
    .focus-box {
      fill: #0c4a6e;
      stroke: #38bdf8;
      stroke-width: 3px;
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.5));
    }
    .resolved-box {
      fill: #064e3b;
      stroke: #10b981;
      stroke-width: 3px;
      filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.6));
    }
    .dim-box {
      opacity: 0.35;
    }
    .att-beam {
      fill: none;
      stroke-linecap: round;
    }
    .beam-strong {
      stroke: #10b981;
      stroke-width: 6px;
      filter: drop-shadow(0 0 15px #10b981);
    }
    .beam-weak {
      stroke: rgba(148, 163, 184, 0.15);
      stroke-width: 2px;
    }
    .banner-insight {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 16px 40px;
      border-radius: 9999px;
      font-size: 22px;
      font-weight: 600;
      color: #38bdf8;
      opacity: 0;
      transform: translateY(20px);
    }
  </style>
  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
</head>
<body>
  <div id="stage">
    <div class="header" id="header">
      <div class="badge">Core Mechanism • All-to-All Self-Attention</div>
      <h1 class="title">Self-Attention: Context in Parallel</h1>
      <p class="subtitle">Every token dynamically scores relevance against all other tokens in the sequence</p>
    </div>

    <div class="attention-stage">
      <svg class="attention-svg" viewBox="0 0 1500 480">
        <!-- Attention Beams from 'it' (x=950, y=360) -->
        <g id="beams-group">
          <!-- to The (x=100) -->
          <path d="M 950 340 Q 525 80 100 340" class="att-beam beam-weak" />
          <!-- to animal (x=270) STRONG ATTENTION -->
          <path id="strong-beam" d="M 950 340 Q 610 20 270 340" class="att-beam beam-strong" />
          <!-- to didn't (x=440) -->
          <path d="M 950 340 Q 695 100 440 340" class="att-beam beam-weak" />
          <!-- to cross (x=610) -->
          <path d="M 950 340 Q 780 120 610 340" class="att-beam beam-weak" />
          <!-- to street (x=780) -->
          <path id="street-beam" d="M 950 340 Q 865 140 780 340" class="att-beam" stroke="#f43f5e" stroke-width="2.5" opacity="0.3" fill="none"/>
          <!-- to tired (x=1380) -->
          <path id="tired-beam" d="M 950 340 Q 1165 120 1380 340" class="att-beam" stroke="#38bdf8" stroke-width="4.5" fill="none" opacity="0.8"/>
        </g>

        <!-- Words Row -->
        <!-- Word 1: The -->
        <g transform="translate(40, 340)">
          <rect width="120" height="60" rx="12" class="word-box" />
          <text x="60" y="30" class="word-node">The</text>
        </g>

        <!-- Word 2: animal (Target) -->
        <g id="node-animal" transform="translate(210, 340)">
          <rect width="130" height="60" rx="12" class="word-box resolved-box" />
          <text x="65" y="30" class="word-node" fill="#34d399">animal</text>
          <text x="65" y="90" fill="#34d399" font-size="16" font-weight="bold" text-anchor="middle">Score: 0.88</text>
        </g>

        <!-- Word 3: didn't -->
        <g transform="translate(380, 340)">
          <rect width="120" height="60" rx="12" class="word-box" />
          <text x="60" y="30" class="word-node">didn't</text>
        </g>

        <!-- Word 4: cross -->
        <g transform="translate(550, 340)">
          <rect width="120" height="60" rx="12" class="word-box" />
          <text x="60" y="30" class="word-node">cross</text>
        </g>

        <!-- Word 5: street -->
        <g id="node-street" transform="translate(720, 340)">
          <rect width="120" height="60" rx="12" class="word-box" />
          <text x="60" y="30" class="word-node">street</text>
          <text x="60" y="90" fill="#94a3b8" font-size="16" text-anchor="middle">Score: 0.05</text>
        </g>

        <!-- Word 6: it (Subject query) -->
        <g id="node-it" transform="translate(890, 340)">
          <rect width="120" height="60" rx="12" class="word-box focus-box" />
          <text x="60" y="30" class="word-node" fill="#38bdf8">it</text>
          <text x="60" y="90" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">[Query Target]</text>
        </g>

        <!-- Word 7: was -->
        <g transform="translate(1060, 340)">
          <rect width="110" height="60" rx="12" class="word-box" />
          <text x="55" y="30" class="word-node">was</text>
        </g>

        <!-- Word 8: too -->
        <g transform="translate(1200, 340)">
          <rect width="100" height="60" rx="12" class="word-box" />
          <text x="50" y="30" class="word-node">too</text>
        </g>

        <!-- Word 9: tired -->
        <g id="node-tired" transform="translate(1330, 340)">
          <rect width="120" height="60" rx="12" class="word-box" stroke="#38bdf8" stroke-width="2"/>
          <text x="60" y="30" class="word-node">tired</text>
          <text x="60" y="90" fill="#38bdf8" font-size="16" text-anchor="middle">Score: 0.64</text>
        </g>
      </svg>

      <div class="banner-insight" id="insight-banner">
        "it" heavily attends to "animal" because "tired" disambiguates the entity that cannot cross
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    tl.to("#header", { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.2)
      .from(".word-box", { scale: 0.8, opacity: 0, stagger: 0.08, duration: 0.8, ease: "back.out(1.5)" }, 0.8)
      .to("#node-it rect", { strokeWidth: 5, boxShadow: "0 0 35px #38bdf8", duration: 0.6 }, 2.0)
      .from(".beam-weak", { strokeDashoffset: 600, strokeDasharray: 600, opacity: 0, duration: 1.2, stagger: 0.1 }, 2.8)
      .from("#strong-beam", { strokeDashoffset: 800, strokeDasharray: 800, duration: 1.5, ease: "power2.out" }, 3.8)
      .to("#node-animal rect", { fill: "#064e3b", stroke: "#10b981", scale: 1.1, duration: 0.8, ease: "back.out(2)" }, 5.2)
      .to("#insight-banner", { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 6.5)
      .to("#stage", { opacity: 0, duration: 0.8, ease: "power2.in" }, 10.0);

    window.seekTimeline = function(seconds) { tl.seek(seconds); };
    window.getTimelineDuration = function() { return 10.9; };
  </script>
</body>
</html>
